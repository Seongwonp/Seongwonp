<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Seongwon Park — Backend Engineer</title>
  <desc id="desc">A dark gradient banner with backend system motifs and Seongwon Park's name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B18"/>
      <stop offset=".48" stop-color="#16143A"/>
      <stop offset="1" stop-color="#071F2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="210" cy="20" r="240" fill="url(#glowPurple)"/>
  <circle cx="1080" cy="300" r="260" fill="url(#glowCyan)"/>

  <g opacity=".55">
    <path d="M746 72h82l28 28h96" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="746" cy="72" r="5" fill="#A78BFA"/>
    <circle cx="952" cy="100" r="5" fill="#A78BFA"/>
    <path d="M826 234h92l24-24h124" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="826" cy="234" r="5" fill="#67E8F9"/>
    <circle cx="1066" cy="210" r="5" fill="#67E8F9"/>
  </g>

  <g transform="translate(755 95)" filter="url(#shadow)">
    <rect width="338" height="134" rx="18" fill="#090C16" stroke="#FFFFFF" stroke-opacity=".14"/>
    <rect x="1" y="1" width="336" height="31" rx="17" fill="#FFFFFF" fill-opacity=".055"/>
    <circle cx="19" cy="16" r="4" fill="#FB7185"/>
    <circle cx="34" cy="16" r="4" fill="#FBBF24"/>
    <circle cx="49" cy="16" r="4" fill="#34D399"/>
    <text x="22" y="63" fill="#8B95A1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">$ ship --measure --improve</text>
    <text x="22" y="91" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">pipeline.status</text>
    <text x="166" y="91" fill="#D1FAE5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">healthy</text>
    <rect x="22" y="108" width="290" height="6" rx="3" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="22" y="108" width="244" height="6" rx="3" fill="url(#accent)"/>
  </g>

  <rect x="72" y="58" width="96" height="26" rx="13" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".12"/>
  <circle cx="90" cy="71" r="5" fill="#34D399"/>
  <text x="102" y="76" fill="#D1D5DB" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">BUILDING</text>

  <text x="72" y="151" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">SEONGWON PARK</text>
  <rect x="72" y="174" width="480" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="216" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">BACKEND SYSTEMS · PLATFORM ENGINEERING</text>
  <text x="72" y="255" fill="#7F8CA3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">design → ship → observe → improve</text>
</svg>
